name: deploy-pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy static assets to docs/
        run: |
          mkdir -p docs/static/css docs/static/js
          cp -f static/css/app.css docs/static/css/app.css
          cp -f static/js/app.js docs/static/js/app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Sync static assets to docs/"
          git push
